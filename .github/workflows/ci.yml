name: GLOROV Monorepo CI & Quality Engineering Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check all workspaces
        run: pnpm turbo typecheck

      - name: Lint all packages
        run: pnpm turbo lint

      - name: Run storefront and backend unit tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test
          JWT_SECRET: supersecret_ci_test_jwt_secret_32chars_long!
          COOKIE_SECRET: supersecret_ci_test_cookie_secret_32chars!
        run: pnpm turbo test

      - name: Run storefront Vitest unit & component test suite
        run: pnpm --filter @glorov/storefront test

  security:
    name: Dependency Vulnerability Audit & SAST Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run high-severity dependency vulnerability audit
        run: |
          pnpm audit --audit-level=high || echo "::warning title=Dependency Vulnerability Audit::Upstream advisories detected in framework dependencies. Review pnpm audit output."

  integration:
    name: Backend HTTP Integration & Critical Regressions
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_postgres_password
          POSTGRES_DB: glorov_medusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:test_postgres_password@localhost:5432/glorov_medusa_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: supersecret_ci_test_jwt_secret_32chars_long!
      COOKIE_SECRET: supersecret_ci_test_cookie_secret_32chars!
      STORE_PUBLISHABLE_KEY: pk_2d4629ab032f218451f992310351db37f7adcc4ea53d3cfa5fc2c95864b717cf
      RAZORPAY_KEY_ID: rzp_test_ci_mock_key_id
      RAZORPAY_KEY_SECRET: rzp_test_ci_mock_key_secret
      RAZORPAY_WEBHOOK_SECRET: mock_razorpay_webhook_secret_dev
      RAZORPAY_MOCK_MODE: "true"
      SHIPROCKET_WEBHOOK_TOKEN: test_shiprocket_token_2026
      SHIPROCKET_MOCK_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Medusa database migrations
        run: pnpm --filter @glorov/backend db:migrate

      - name: Seed Indian botanical region & test catalog
        run: |
          pnpm --filter @glorov/backend exec npx tsx src/scripts/seed-india-region.ts || true

      - name: Build backend artifacts
        run: pnpm --filter @glorov/backend build

      - name: Start Medusa backend server for integration tests
        run: |
          pnpm --filter @glorov/backend start &
          # Wait for health check endpoint to be ready
          for i in {1..30}; do
            if curl -s http://localhost:9000/health | grep -q "OK"; then
              echo "Medusa backend is ready!"
              break
            fi
            echo "Waiting for backend on port 9000... (attempt $i/30)"
            sleep 2
          done

      - name: Run all 9 Backend HTTP Integration Test Suites
        run: pnpm --filter @glorov/backend test:integration:http

  storefront-e2e:
    name: Storefront Playwright E2E Test Suite
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser
        run: pnpm --filter @glorov/storefront exec playwright install --with-deps chromium

      - name: Run Storefront Playwright E2E Tests
        run: pnpm --filter @glorov/storefront test:e2e --project=chromium

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [quality, security, integration, storefront-e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages & apps
        run: pnpm turbo build

  lighthouse:
    name: Core Web Vitals & Lighthouse CI Gate
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront for Lighthouse CI
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
        run: pnpm --filter @glorov/storefront build

      - name: Run Lighthouse CI Audits
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
