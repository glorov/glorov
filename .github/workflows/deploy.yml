name: GLOROV Automated Deployment & Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: 'Execute database migrations before server boot'
        required: true
        default: true
        type: boolean
      skip_smoke_tests:
        description: 'Bypass post-deployment smoke verification (Emergency only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Pre-Deployment Validation Gate (Lint, Typecheck, Unit & Integration Tests)
  # ----------------------------------------------------------------------------
  validate:
    name: 1. Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Tag / Branch
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript Verification
        run: pnpm turbo typecheck

      - name: Enforce Code Quality & Linter
        run: pnpm turbo lint

      - name: Execute Full Test Suites (Storefront & Backend Unit)
        run: pnpm turbo test

      - name: Build Application Artifacts
        run: pnpm turbo build

  # ----------------------------------------------------------------------------
  # Job 2: Staging Deployment
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: 2. Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [validate]
    environment:
      name: staging
      url: https://staging.glorov.in
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Staging Application & Run Migrations
        shell: bash
        env:
          STAGING_DEPLOY_WEBHOOK: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
          RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations || 'true' }}
        run: |
          echo "🌿 Deploying release ${{ github.ref_name }} to Staging environment..."
          if [ -n "$STAGING_DEPLOY_WEBHOOK" ]; then
            curl -s -X POST "$STAGING_DEPLOY_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"ref": "${{ github.ref }}", "run_migrations": "'"$RUN_MIGRATIONS"'"}'
          else
            echo "ℹ️  No STAGING_DEPLOY_WEBHOOK configured; skipping external webhook trigger."
          fi
          echo "✅ Staging deployment command dispatched."

  # ----------------------------------------------------------------------------
  # Job 3: Staging Post-Deployment Smoke Verification
  # ----------------------------------------------------------------------------
  smoke-test-staging:
    name: 3. Verify Staging Health & Smoke Suite
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: ${{ github.event.inputs.skip_smoke_tests != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run Smoke Verification against Staging Targets
        shell: bash
        env:
          STAGING_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL || 'https://api-staging.glorov.in' }}
          STAGING_STOREFRONT_URL: ${{ vars.STAGING_STOREFRONT_URL || 'https://staging.glorov.in' }}
        run: |
          echo "🔍 Awaiting staging container warm-up (15s)..."
          sleep 15
          node scripts/smoke-test.mjs "$STAGING_BACKEND_URL" "$STAGING_STOREFRONT_URL" || {
            echo "❌ Staging smoke tests failed! Halting pipeline before production approval."
            exit 1
          }

  # ----------------------------------------------------------------------------
  # Job 4: Production Deployment (Protected by GitHub Environment Manual Approval)
  # ----------------------------------------------------------------------------
  deploy-production:
    name: 4. Deploy to Production (Requires SRE Approval)
    runs-on: ubuntu-latest
    needs: [validate, deploy-staging, smoke-test-staging]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_environment == 'production' }}
    environment:
      name: production
      url: https://glorov.in
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Production Application & Run Migrations
        shell: bash
        env:
          PROD_DEPLOY_WEBHOOK: ${{ secrets.PROD_DEPLOY_WEBHOOK }}
          RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations || 'true' }}
        run: |
          echo "🌿 Initiating Production Deployment for version ${{ github.ref_name }}..."
          if [ -n "$PROD_DEPLOY_WEBHOOK" ]; then
            curl -s -X POST "$PROD_DEPLOY_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"ref": "${{ github.ref }}", "run_migrations": "'"$RUN_MIGRATIONS"'"}'
          else
            echo "ℹ️  No PROD_DEPLOY_WEBHOOK configured; release bundle prepared."
          fi
          echo "✅ Production deployment command dispatched."

  # ----------------------------------------------------------------------------
  # Job 5: Production Post-Deployment Smoke Verification
  # ----------------------------------------------------------------------------
  smoke-test-production:
    name: 5. Verify Production Health & Smoke Suite
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: ${{ github.event.inputs.skip_smoke_tests != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run Smoke Verification against Production Targets
        shell: bash
        env:
          PROD_BACKEND_URL: ${{ vars.PROD_BACKEND_URL || 'https://api.glorov.in' }}
          PROD_STOREFRONT_URL: ${{ vars.PROD_STOREFRONT_URL || 'https://glorov.in' }}
        run: |
          echo "🔍 Awaiting production container warm-up (15s)..."
          sleep 15
          node scripts/smoke-test.mjs "$PROD_BACKEND_URL" "$PROD_STOREFRONT_URL" || {
            echo "❌ CRITICAL: Production smoke tests failed! Initiate immediate rollback."
            exit 1
          }
