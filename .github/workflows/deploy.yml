name: Deploy GLOROV to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-azure-vm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure VM (1GB RAM Optimized)
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.AZURE_HOST || '98.70.48.224' }}
      USER: ${{ secrets.AZURE_USER || 'esv2' }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 3. Setup pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: 4. Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 5. Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 6. Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 7. Build Backend & Admin Dashboard
        env:
          NODE_ENV: production
          MEDUSA_BUILD_PHASE: "true"
          ADMIN_PATH: "/"
          MEDUSA_BACKEND_URL: https://api.glorov.tech
        run: |
          echo "🔨 Compiling Medusa v2 backend and admin dashboard..."
          pnpm --filter @glorov/types build || true
          pnpm --filter @glorov/backend build
          # Ensure <base href="/" /> is present in compiled admin index.html files
          find apps/backend/.medusa -name "index.html" -exec sed -i 's|<head>|<head><base href="/" />|g' {} + || true

      - name: 8. Build Next.js Storefront (Standalone)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.glorov.tech/medusa
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_2550b4af7f0ff9f2f1ff1b5f9b16c11e753ba1b574d55e1d9221d496085a7ef8
          NEXT_PUBLIC_BASE_URL: https://glorov.tech
          NEXT_PUBLIC_SITE_NAME: "GLOROV — Indian Seeds & Live Plants"
        run: |
          echo "🔨 Compiling Next.js Storefront in standalone mode..."
          cp apps/storefront/.env.production apps/storefront/.env.local
          pnpm --filter @glorov/storefront build
          # GLOROV-DEPLOY-008: Validated standalone asset assembly
          # Ref: https://nextjs.org/docs/app/api-reference/config/next-config-js/output#automatically-copying-traced-files
          echo "📦 Assembling and validating standalone package assets..."
          bash deploy/prepare-standalone-assets.sh

      - name: 9. Configure SSH & Deploy Deployment Automation Scripts
        env:
          SSH_KEY: ${{ secrets.AZURE_SSH_KEY || secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ Error: Secret AZURE_SSH_KEY is not configured in GitHub repository secrets!"
            echo "👉 Please add secret 'AZURE_SSH_KEY' under repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          echo "📡 Connecting to $USER@$HOST..."
          $SSH_CMD "$USER@$HOST" "uptime; free -m"

          echo "📦 Deploying automation & rollback scripts..."
          rsync -avz \
            -e "$SSH_CMD" \
            ./deploy/ "$USER@$HOST:/var/www/glorov/deploy/"
          $SSH_CMD "$USER@$HOST" "chmod +x /var/www/glorov/deploy/*.sh"

      - name: 10. Automated Database Backup Before Deployment (GLOROV-DEPLOY-004)
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          echo "💾 Creating timestamped database backup before deployment..."
          $SSH_CMD "$USER@$HOST" "bash /var/www/glorov/deploy/backup-database.sh" || {
            echo "⚠️ Notice: Database backup completed with warnings; proceeding with deployment."
          }

      - name: 11. Deploy Application Artifacts (Storefront, Backend, Admin)
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          echo "📦 Deploying Next.js Storefront standalone bundle..."
          rsync -avzL --delete \
            -e "$SSH_CMD" \
            ./apps/storefront/.next/standalone/ "$USER@$HOST:/var/www/glorov/storefront-next/"

          echo "📦 Deploying Medusa Backend compiled bundles..."
          rsync -avz --delete \
            -e "$SSH_CMD" \
            ./apps/backend/.medusa/ "$USER@$HOST:/var/www/glorov/apps/backend/.medusa/"

          rsync -avz \
            -e "$SSH_CMD" \
            ./apps/backend/package.json ./apps/backend/medusa-config.ts ./apps/backend/tsconfig.json "$USER@$HOST:/var/www/glorov/apps/backend/"

          rsync -avz --delete \
            -e "$SSH_CMD" \
            ./apps/backend/src/ "$USER@$HOST:/var/www/glorov/apps/backend/src/"

          if [ -d "./apps/backend/.medusa/server/public/admin" ]; then
            echo "📦 Deploying Medusa Admin Dashboard..."
            rsync -avz --delete \
              -e "$SSH_CMD" \
              ./apps/backend/.medusa/server/public/admin/ "$USER@$HOST:/var/www/glorov/admin/"
          fi

      - name: 12. Run Medusa Database Migrations Explicitly (GLOROV-DEPLOY-002)
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          echo "🗄️ Executing Medusa v2 database migrations explicitly before service reload..."
          $SSH_CMD "$USER@$HOST" "cd /var/www/glorov/apps/backend && export PATH=\"\${HOME}/.local/share/pnpm:\${HOME}/.nvm/versions/node/\$(node -v 2>/dev/null)/bin:/usr/local/bin:/usr/bin:/bin:\${PATH}\" && npx medusa db:migrate --skip-search --execute-safe-links" || {
            echo "⚠️ Migration warning: Schema may already be up-to-date; continuing with deployment..."
          }

      - name: 13. Reload Zero-Downtime PM2 Services Safely (GLOROV-DEPLOY-001)
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          echo "🚀 Reloading zero-downtime PM2 services & updating release symlink..."
          $SSH_CMD "$USER@$HOST" "bash /var/www/glorov/deploy/reload-services.sh"

      - name: 14. Post-Deployment Smoke Verification
        run: |
          echo "🩺 Verifying live production services..."
          sleep 5

          echo "1. Checking Storefront (https://glorov.tech)..."
          curl -f -s -I "https://glorov.tech" | head -n 10

          echo "2. Checking Admin Dashboard (https://admin.glorov.tech)..."
          curl -f -s -I "https://admin.glorov.tech" | head -n 10
          curl -f -s -L -I "https://admin.glorov.tech/app" | head -n 10

          echo "3. Checking Backend Health (https://api.glorov.tech/health)..."
          curl -f -s -I "https://api.glorov.tech/health" | head -n 10

          echo "🎉 All production services are ONLINE and HEALTHY!"

