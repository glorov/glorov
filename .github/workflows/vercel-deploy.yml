name: Vercel Auto-Deploy Trigger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-vercel:
    name: Trigger Vercel Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Send Deploy Webhook to Vercel
        run: |
          echo "🚀 Triggering Vercel production deployment hook..."
          RESPONSE=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL || 'https://api.vercel.com/v1/integrations/deploy/prj_hW7jKJQqYAvhMuMKp7YvbAxCVj23/w8Bl899HP2' }}")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"state"'; then
            echo "✅ Successfully triggered Vercel deployment!"
          else
            echo "⚠️ Response from Vercel: $RESPONSE"
          fi
