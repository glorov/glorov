# 3. Storefront: Any direct VM hit on apex or www redirects directly to canonical Vercel storefront
server {
    listen 80;
    server_name glorov.tech www.glorov.tech glorov.com www.glorov.com;
    return 301 https://www.glorov.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name glorov.tech www.glorov.tech;

    ssl_certificate /etc/letsencrypt/live/glorov.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glorov.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://www.glorov.com$request_uri;
}
