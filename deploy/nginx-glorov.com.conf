# 2. Admin Dashboard: admin.glorov.tech & admin.glorov.com -> /var/www/glorov/current/admin
server {
    listen 80;
    server_name admin.glorov.tech admin.glorov.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.glorov.tech;

    ssl_certificate /etc/letsencrypt/live/glorov.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glorov.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/glorov/current/admin;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression for large Admin assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Proxy Medusa Admin API requests directly to backend
    location /admin/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Proxy Medusa Auth requests directly to backend
    location /auth/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Legacy /app/ prefix redirect to root /
    rewrite ^/app/(.*)$ /$1 permanent;
    rewrite ^/app$ / permanent;

    # Rewrite any nested /assets/ paths (e.g. /login/assets/, /orders/assets/) to root /assets/
    rewrite ^/.+/assets/(.*)$ /assets/$1 permanent;

    # Explicit handling for Medusa Admin base path (/app/assets/)
    location ^~ /app/assets/ {
        alias /var/www/glorov/current/admin/assets/;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # Explicit handling for root /assets/
    location ^~ /assets/ {
        alias /var/www/glorov/current/admin/assets/;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    location ~* \.(js|mjs)$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

