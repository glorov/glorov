# ==============================================================================
# GLOROV Custom Domain Nginx Configuration (glorov.tech)
# ==============================================================================

# 1. API: api.glorov.tech -> Medusa Backend (Port 9000)
server {
    listen 80;
    server_name api.glorov.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.glorov.tech;

    ssl_certificate /etc/letsencrypt/live/glorov.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glorov.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /static/ {
        alias /var/www/glorov/apps/backend/static/;
        expires 30d;
        access_log off;
    }

    location /medusa/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# 2. Admin Dashboard: admin.glorov.tech -> /var/www/glorov/admin
server {
    listen 80;
    server_name admin.glorov.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.glorov.tech;

    ssl_certificate /etc/letsencrypt/live/glorov.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glorov.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/glorov/admin;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression for large Admin assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Proxy Medusa Admin API requests directly to backend
    location /admin/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.glorov.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Proxy Medusa Auth requests directly to backend
    location /auth/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.glorov.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Explicit handling for Medusa Admin base path (/app/assets/)
    location ^~ /app/assets/ {
        alias /var/www/glorov/admin/assets/;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # Explicit handling for root /assets/
    location ^~ /assets/ {
        alias /var/www/glorov/admin/assets/;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    location ~* \.(js|mjs)$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

# 3. Storefront: glorov.tech & www.glorov.tech -> Next.js Standalone (Port 3001)
server {
    listen 80;
    server_name glorov.tech www.glorov.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name glorov.tech www.glorov.tech;

    ssl_certificate /etc/letsencrypt/live/glorov.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glorov.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Gzip Compression for Next.js SSR and assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Unregister stale legacy Flutter service workers immediately
    location = /flutter_service_worker.js {
        default_type application/javascript;
        return 200 "self.addEventListener('install', () => self.skipWaiting()); self.addEventListener('activate', () => self.registration.unregister());";
    }

    # Next.js static asset chunks — immutable cache, served directly by Nginx (0% Node CPU)
    location /_next/static/ {
        alias /var/www/glorov/storefront-next/apps/storefront/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static assets served directly by Nginx with fallback to Next.js
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml|.*\.(png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf|eot))$ {
        root /var/www/glorov/storefront-next/apps/storefront/public;
        try_files $uri @nextjs;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Proxy all SSR pages, dynamic routes, and API endpoints to Next.js standalone on port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location @nextjs {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
