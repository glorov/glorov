name: glorov-production

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database (Tuned for 1GB RAM Azure VM)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: glorov-prod-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "effective_cache_size=256MB"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password is required}
      POSTGRES_DB: ${DB_NAME:-glorov_medusa_prod}
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-glorov_medusa_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    networks:
      - glorov-internal

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Cache & Event Bus (LRU Eviction Tuned for 1GB RAM Azure VM)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: glorov-prod-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?Redis password is required}"
      - "--maxmemory"
      - "96mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - prod-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - glorov-internal

  # ----------------------------------------------------------------------------
  # 3. Medusa v2 Commerce Backend (256MB Node Heap)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: glorov-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9000
      NODE_OPTIONS: "--max-old-space-size=256"
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-glorov_medusa_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      STORE_CORS: ${STORE_CORS:-https://glorov.com,https://www.glorov.com,https://glorov.tech,https://www.glorov.tech}
      ADMIN_CORS: ${ADMIN_CORS:-https://admin.glorov.com,https://admin.glorov.tech}
      AUTH_CORS: ${AUTH_CORS:-https://glorov.com,https://admin.glorov.com,https://glorov.tech,https://admin.glorov.tech}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID is required}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET is required}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
      RAZORPAY_MOCK_MODE: "false"
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD}
      SHIPROCKET_WEBHOOK_TOKEN: ${SHIPROCKET_WEBHOOK_TOKEN}
      SHIPROCKET_PICKUP_LOCATION: ${SHIPROCKET_PICKUP_LOCATION:-"Pune Central Nursery Hub"}
      SHIPROCKET_PICKUP_PINCODE: ${SHIPROCKET_PICKUP_PINCODE:-"411001"}
      SHIPROCKET_MOCK_MODE: "false"
      COD_MAX_AMOUNT_PAISE: ${COD_MAX_AMOUNT_PAISE:-500000}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-orders@glorov.in}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFICATION_MOCK_MODE: "false"
      # GLOROV-DEPLOY-002: Automatic migration disabled in production to prevent unreviewed schema changes on restart.
      # Migrations must be run manually before deployment.
      AUTO_MIGRATE: "false"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - glorov-internal
      - glorov-public

  # ----------------------------------------------------------------------------
  # 4. Next.js 15 Storefront (128MB Node Heap)
  # ----------------------------------------------------------------------------
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: glorov-prod-storefront
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=128"
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://backend:9000}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://glorov.in}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - glorov-internal
      - glorov-public

  # ----------------------------------------------------------------------------
  # 5. Reverse Proxy & Automated SSL (Caddy)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: glorov-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_healthy
    networks:
      - glorov-public

volumes:
  prod-pgdata:
  prod-redisdata:
  caddy-data:
  caddy-config:

networks:
  glorov-internal:
    internal: true
  glorov-public:
